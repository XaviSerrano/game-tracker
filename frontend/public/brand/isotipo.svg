<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
<title id="title">Gamepad logo</title>
<desc id="desc">Gamepad-inspired scalable vector logo.</desc>
<defs>

<linearGradient id="shell" x1="0" y1="0" x2="0.85" y2="1">
  <stop offset="0" stop-color="#8d82ff"/>
  <stop offset=".48" stop-color="#5142d6"/>
  <stop offset="1" stop-color="#241c83"/>
</linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#776cff"/><stop offset="1" stop-color="#3527ad"/>
</linearGradient>
<linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
