<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-label="Mando retro">
  <title>Mando retro - logo principal</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F1F3"/>
      <stop offset="1" stop-color="#C9C9CF"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9A9AF"/>
      <stop offset="1" stop-color="#8A8A91"/>
    </linearGradient>
    <linearGradient id="dpad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A5A62"/>
      <stop offset="1" stop-color="#3A3A41"/>
    </linearGradient>
    <radialGradient id="blue" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#6C93F2"/><stop offset="1" stop-color="#2450C2"/></radialGradient>
    <radialGradient id="green" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#58C97A"/><stop offset="1" stop-color="#1F8A41"/></radialGradient>
    <radialGradient id="red" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#F2677A"/><stop offset="1" stop-color="#C41E31"/></radialGradient>
    <radialGradient id="yellow" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFE07A"/><stop offset="1" stop-color="#E0B01B"/></radialGradient>
  </defs>

  <!-- cuerpo -->
  <path d="M110 36H370A84 84 0 0 1 454 120A84 84 0 0 1 370 204C330 204 310 176 240 176C170 176 150 204 110 204A84 84 0 0 1 26 120A84 84 0 0 1 110 36Z"
        fill="url(#body)" stroke="#8E8E96" stroke-width="4" stroke-linejoin="round"/>

  <!-- base cruceta -->
  <circle cx="110" cy="120" r="56" fill="#DADADF" stroke="#B4B4BB" stroke-width="2"/>
  <!-- cruceta -->
  <g fill="url(#dpad)">
    <rect x="94" y="78" width="32" height="84" rx="7"/>
    <rect x="68" y="104" width="84" height="32" rx="7"/>
  </g>
  <circle cx="110" cy="120" r="6" fill="#2C2C32"/>

  <!-- select / start -->
  <g fill="#6B6B73">
    <rect x="178" y="122" width="44" height="16" rx="8" transform="rotate(-35 200 130)"/>
    <rect x="228" y="122" width="44" height="16" rx="8" transform="rotate(-35 250 130)"/>
  </g>

  <!-- placa botones -->
  <circle cx="370" cy="120" r="66" fill="url(#plate)"/>
  <rect x="338" y="104" width="64" height="32" rx="16" transform="rotate(-45 370 120)" fill="#C9C9CF" opacity=".55"/>

  <!-- botones: X arriba, Y izquierda, A derecha, B abajo -->
  <circle cx="370" cy="86"  r="17" fill="url(#blue)"/>
  <circle cx="336" cy="120" r="17" fill="url(#green)"/>
  <circle cx="404" cy="120" r="17" fill="url(#red)"/>
  <circle cx="370" cy="154" r="17" fill="url(#yellow)"/>
</svg>
